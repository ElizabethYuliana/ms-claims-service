openapi: 3.0.3
info:
  title: Claims Management API
  description: API for managing insurance claims
  version: 1.0.0
servers:
  - url: 'https'
security:
  - bearerAuth: []
paths:
    /claims:
      post:
        summary: Create a new claim
        operationId: createClaim
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        responses:
          '201':
            description: Claim created successfully
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/CreateClaimResponse'
          '400':
            description: Bad request
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'
          '500':
            description: Internal server error
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'

    /claims/{claimId}:
      get:
          summary: Retrieve a claim by ID
          operationId: getClaimById
          parameters:
            - $ref: '#/components/parameters/claimId'
          responses:
            '200':
              description: Claim retrieved successfully
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Claim'
            '404':
              description: Claim not found
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/ErrorResponse'
            '500':
              description: Internal server error
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/ErrorResponse'

    /claims/customer:
      get:
        summary: Retrieve all claims for a customer
        operationId: getClaimsByCustomer
        parameters:
          - $ref: '#/components/parameters/customerId'
          - $ref: '#/components/parameters/page'
          - $ref: '#/components/parameters/size'
        responses:
          '200':
            description: Claims retrieved successfully
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ClaimPage'
          '404':
            description: Customer not found
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'
          '500':
            description: Internal server error
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'

    /claims/{claimId}/status:
      put:
        summary: Update the status of a claim
        operationId: updateClaimStatus
        parameters:
          - $ref: '#/components/parameters/claimId'
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateClaimStatus'
        responses:
          '200':
            description: Claim status updated successfully
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Claim'
          '400':
            description: Bad request
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'
          '404':
            description: Claim not found
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'
          '500':
            description: Internal server error
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'

    /claims/{claimId}/history:
      get:
        summary: Retrieve the history of a claim
        operationId: getClaimHistory
        parameters:
          - $ref: '#/components/parameters/claimId'
        responses:
          '200':
            description: Claim history retrieved successfully
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ClaimHistory'
          '404':
            description: Claim not found
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'
          '500':
            description: Internal server error
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'

    /claims/report/monthly:
      get:
        summary: Generate a monthly report of claims
        operationId: generateMonthlyReport
        parameters:
          - $ref: '#/components/parameters/month'
        responses:
          '200':
            description: Monthly report generated successfully
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ClaimMonthlyReport'
          '400':
            description: Bad request
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'
          '500':
            description: Internal server error
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    claimId:
      name: claimId
      in: path
      required: true
      schema:
        type: string
      description: Unique identifier for the claim
    customerId:
      name: customerId
      in: query
      required: true
      schema:
          type: string
      description: Unique identifier for the customer
    page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 0
      description: Page number for pagination
    size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        default: 10
      description: Number of claims per page
    month:
      name: month
      in: query
      required: true
      schema:
        type: string
        format: date
      description: Month for which the report is generated

  schemas:
    Claim:
      type: object
      properties:
        claimId:
          type: string
          description: Unique identifier for the claim
        customerId:
          type: string
          description: Unique identifier for the customer
        sinisterType:
          type: string
          description: Type of the sinister (e.g., accident, theft)
        description:
          type: string
          description: Description of the claim
        dateOfIncident:
          type: string
          format: date
          description: Date of the incident
        documentation:
          type: array
          items:
            type: string
            format: uri
          description: List of documentation URLs related to the claim
        status:
          type: enum
          enum:
              - PENDING_DOCUMENTATION
              - PENDING
              - CLOSED

    ClaimPage:
      type: object
      properties:
        claims:
          type: array
          items:
            $ref: '#/components/schemas/Claim'
        totalElements:
          type: integer
          description: Total number of claims available
        totalPages:
          type: integer
          description: Total number of pages available
        pageNumber:
          type: integer
          description: Current page number
        pageSize:
          type: integer
          description: Number of claims per page

    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
          description: Error code
        message:
          type: string
          description: Error message
        details:
          type: string
          description: Additional error details

    CreateClaimResponse:
      type: object
      properties:
        claimId:
          type: string
          description: Unique identifier for the created claim
        message:
          type: string
          description: Confirmation message for the created claim

    ClaimHistory:
      type: object
      properties:
        date:
          type: string
          format: date-time
          description: Date of the status change
        status:
          type: string
          description: Status of the claim at that time
        notes:
          type: string
          description: Additional notes regarding the status change

    ClaimMonthlyReport:
      type: object
      properties:
        totalClaims:
          type: integer
          description: Total number of claims for the month
        claimsByStatus:
          type: object
          additionalProperties:
            type: integer
            description: Number of claims by status (e.g., PENDING, CLOSED)
        month:
          type: string
          format: date
          description: The month for which the report is generated

    UpdateClaimStatus:
      type: object
      properties:
        status:
          type: string
          enum:
            - PENDING_DOCUMENTATION
            - PENDING
            - CLOSED
          description: New status for the claim
        notes:
          type: string
          description: Additional notes regarding the status update
